<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Excluir</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #dc2626;
        }

        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button:hover {
            background: #b91c1c;
        }

        .cancelar {
            text-decoration: none;
            color: #333;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Tem certeza?</h1>

        <form method="post">

            {% csrf_token %}

            <button type="submit">
                Excluir
            </button>

        </form>

        <a class="cancelar" href="/">
            Cancelar
        </a>

    </div>

</body>

</html>
